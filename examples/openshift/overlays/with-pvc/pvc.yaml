apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drupal-public-files
  labels:
    app: drupal-runtime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: gp3-csi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drupal-private-files
  labels:
    app: drupal-runtime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: gp3-csi
