[www]
; Ignored when the master is not root (USER 1001). FPM workers run as the
; container user. Keep for a privileged start.
user = drupal
group = root

listen = /run/php-fpm/drupal.sock
; Do not set listen.owner/group: when not root FPM cannot chown, and OpenShift
; arbitrary UIDs would try to chown the socket to uid 1001 (EPERM). Socket is
; created as the current uid; Apache is the same user.
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php .phar

; Official FPM monitor. Apache Location /healthz proxies here; FPM answers
; "pong" without running PHP. Must match SCRIPT_NAME from 25-healthz.conf.
ping.path = /healthz
ping.response = pong


request_terminate_timeout = 120s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

php_admin_value[cgi.fix_pathinfo] = 0
php_admin_value[session.save_handler] = files
php_admin_value[session.save_path] = /tmp/php-sessions
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = Off
php_admin_flag[expose_php] = Off
php_admin_flag[allow_url_include] = Off
