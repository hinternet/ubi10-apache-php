ServerRoot "/opt/httpd"
ServerName localhost
Listen 8080

DefaultRuntimeDir "/run/httpd"
PidFile "/run/httpd/httpd.pid"
Mutex default:/run/httpd
ScoreBoardFile "/run/httpd/apache_runtime_status"

# ServerRoot must be set before these Includes. Paths are relative to it.
# conf.modules.d: LoadModule only (sorted). conf.d: module/site config (sorted).
Include conf.modules.d/*.conf

Timeout 120
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 100
# 128Mi — matches post_max_size / upload_max_filesize in 10-drupal.ini.
LimitRequestBody 134217728

TypesConfig /etc/mime.types
AddDefaultCharset UTF-8
EnableSendfile Off
EnableMMAP Off
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Slowloris: cap how long a client may dribble headers/body.
<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

ErrorLog /dev/stderr
LogLevel warn
# %D = microseconds (OpenShift / probe timing). env=!dontlog skips /healthz.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" combined
CustomLog /dev/stdout combined env=!dontlog

DocumentRoot "/var/www/html/web"
DirectoryIndex index.php index.html

<Directory />
    AllowOverride none
    Options None
    Require all denied
</Directory>

<Directory "/var/www/html">
    AllowOverride none
    Options None
    Require all denied
</Directory>

<Directory "/var/www/html/web">
    Options +FollowSymLinks -Indexes -MultiViews
    AllowOverride All
    Require all granted

    # settings.php is a real file: FPM's -f guard would execute it if
    # .htaccess were skipped. Filename-only; module *.services.yml is safe.
    <FilesMatch "^(settings|services)(\.[^.]+)?\.(php|yml)$">
        Require all denied
    </FilesMatch>
</Directory>

<Files ".ht*">
    Require all denied
</Files>

<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>

<DirectoryMatch "/\.(git|svn|hg)(/|$)">
    Require all denied
</DirectoryMatch>

<Location "/server-status">
    SetHandler server-status
    Require local
</Location>

IncludeOptional conf.d/*.conf
