# Exactly one MPM. event is the one that belongs with PHP-FPM.
# prefork is required by libphp (mod_php) and must stay disabled.
# worker is the older threaded MPM; event supersedes it.

#LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
#LoadModule mpm_worker_module  modules/mod_mpm_worker.so
LoadModule mpm_event_module    modules/mod_mpm_event.so
