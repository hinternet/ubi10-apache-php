# Server-level headers. X-Frame-Options is left to Drupal
# ($settings['x_frame_options'], default SAMEORIGIN) to avoid a duplicate.
# HSTS belongs on the OpenShift edge Route, not on HTTP :8080.
<IfModule headers_module>
    # HTTPoxy (CVE-2016-5387). early = before proxy/FPM; .htaccess is later.
    RequestHeader unset Proxy early

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    Header always unset X-Powered-By
    Header always unset X-Generator
    Header always unset X-Drupal-Cache
    Header always unset X-Drupal-Dynamic-Cache
    Header always unset X-Drupal-Cache-Tags
    Header always unset X-Drupal-Cache-Contexts
    Header always unset X-Drupal-Cache-Max-Age
    Header always unset X-Debug-Token
    Header always unset X-Debug-Token-Link
</IfModule>
