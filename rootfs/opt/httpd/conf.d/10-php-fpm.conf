# PHP via proxy_fcgi + PHP-FPM unix socket. Do not load libphp (mod_php).
<IfModule proxy_fcgi_module>
    ProxyRequests Off
    ProxyFCGIBackendType FPM

    <Directory "/var/www/html/web">
        CGIPassAuth On
        <FilesMatch \.(php|phar)$>
            <If "-f %{REQUEST_FILENAME}">
                SetHandler "proxy:unix:/run/php-fpm/drupal.sock|fcgi://localhost"
            </If>
        </FilesMatch>
    </Directory>

    # Reuse FPM workers; timeout must match Timeout / request_terminate_timeout (120s).
    <Proxy "unix:/run/php-fpm/drupal.sock|fcgi://localhost">
        ProxySet enablereuse=on timeout=120
    </Proxy>
</IfModule>

<Files ".user.ini">
    Require all denied
</Files>
