# OpenShift Route / any ingress: restore the client IP and HTTPS scheme.
# RemoteIPInternalProxy = hops we strip from X-Forwarded-For. Default RFC1918 +
# loopback + link-local + ULA covers OVN/OpenShift SDN and local docker/podman.
# If ingress uses hostNetwork with public node IPs, add those CIDRs in a later
# conf.d snippet (e.g. 21-remoteip-extra.conf). Do not omit InternalProxy — that
# trusts X-Forwarded-For from everyone.
<IfModule remoteip_module>
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16
    RemoteIPInternalProxy 127.0.0.0/8
    RemoteIPInternalProxy 169.254.0.0/16
    RemoteIPInternalProxy fd00::/8
    RemoteIPInternalProxy ::1
</IfModule>

# %{HTTPS} stays off on an edge Route (Apache is HTTP). This sets env HTTPS for
# PHP $_SERVER['HTTPS']. Drupal still needs $settings['reverse_proxy'] downstream.
<IfModule setenvif_module>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</IfModule>
