# Drupal SA-2006-006 / SA-2013-003. Public files sit under the docroot; FPM
# would execute an uploaded .php if only the files/.htaccess protected them.
# AllowOverride None so a dropped .htaccess cannot re-enable a handler.
# (/|$) so files/ and files/field/image/ match, filesfoo does not.
<DirectoryMatch "^/var/www/html/web/sites/[^/]+/files(/|$)">
    Options -Indexes -ExecCGI -Includes -MultiViews
    AllowOverride None
    SetHandler Drupal_Security_Do_Not_Remove_See_SA_2006_006
    <Files *>
        SetHandler Drupal_Security_Do_Not_Remove_See_SA_2013_003
    </Files>
    <FilesMatch "\.(php|phar|phtml|phps|php[0-9]+)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# Outside the docroot; deny anyway in case of an Alias.
<Directory "/var/www/html/files-private">
    AllowOverride None
    Options None
    Require all denied
</Directory>
