# On-the-fly gzip for HTML/JSON/etc. Drupal .htaccess already serves
# precompressed aggregated CSS/JS (.gz) and sets no-gzip on those.
# filter_module is loaded before deflate_module (10-base.conf).
<IfModule deflate_module>
    AddOutputFilterByType DEFLATE \
        text/html text/plain text/xml text/css text/javascript \
        application/javascript application/json application/xml \
        application/rss+xml application/atom+xml image/svg+xml
    SetEnvIfNoCase Request_URI \
        \.(?:gif|jpe?g|png|webp|avif|zip|gz|br|woff2?)$ no-gzip
</IfModule>
