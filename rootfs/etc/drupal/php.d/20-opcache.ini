[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 16229
; 16M is the usual Drupal default. Raise to 32 downstream if interned strings fill
; (opcache_get_status()["interned_strings_usage"]).
opcache.interned_strings_buffer = 16
; Immutable image: never stat() source. A new deploy is a new pod / FPM restart.
; revalidate_freq is ignored while this is 0; omitted on purpose.
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = disable
opcache.jit_buffer_size = 0
; Needs hugepages + privilege. Off in OpenShift.
opcache.huge_code_pages = Off
