[PHP]
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
post_max_size = 128M
upload_max_filesize = 128M
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
allow_url_include = Off
sys_temp_dir = /tmp
upload_tmp_dir = /tmp
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = UTC

[Session]
session.save_handler = files
session.save_path = /tmp/php-sessions
session.cookie_httponly = 1
; Do not set cookie_secure=1 here: it drops the session cookie on local HTTP
; (make run). OpenShift edge TLS: set $settings['reverse_proxy'] and Drupal/
; Symfony will mark cookies Secure from X-Forwarded-Proto.
; session.cookie_secure = 1
session.use_only_cookies = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
