[apcu]
; extension=apcu.so is already loaded by Remi /etc/php.d/40-apcu.ini.
; shm_segments was removed in APCu 5.1.25 — do not set it.
apc.enabled = 1
; CLI uses a private APCu segment; Drupal cache + Drush would diverge. Off.
apc.enable_cli = 0
; Drupal 11 core status check: 32 MB is the recommended default (system.install).
; Raise in zz-apcu.ini if the status report shows APCu >75% full.
apc.shm_size = 128M
; Let APCu size the hash (512 entries per 1MB). Do not under-hint.
apc.entries_hint = 0
; Drupal ApcuBackend expires in PHP (prepareItem), not APCu TTL.
apc.ttl = 0
apc.gc_ttl = 3600
apc.slam_defense = 0
; php = APCu and Drupal 11 core default (serialize()). Not igbinary.
apc.serializer = php
