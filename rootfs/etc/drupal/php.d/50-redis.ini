[redis]
; extension=redis.so is already loaded by Remi. Leave it loaded: you cannot
; unload an extension from a later ini, and a loaded-but-idle module is cheap.
; Do not set session.save_handler=redis or a default host here — Drupal enables
; Redis from settings.php when the service exists. Downstream can add
; redis.session.* in zz-redis.ini if they switch PHP sessions to Redis.
