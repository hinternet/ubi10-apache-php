[redis]
; extension=redis.so is already loaded by Remi. Leave it loaded: you cannot
; unload an extension from a later ini, and a loaded-but-idle module is cheap.
; Do not set session.save_handler or a default host here. www.conf locks
; session.save_handler to files with php_admin_value, so a later ini is ignored.
; Point Drupal at Redis from settings.php (the Redis module's session service).
